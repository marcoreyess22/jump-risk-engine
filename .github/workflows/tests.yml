name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      # data/prices.csv is versioned, so the suite runs fully offline. No
      # network call, no API key, no rate limit to flake on.
      - name: Validation suite
        env:
          MPLCONFIGDIR: /tmp/mpl
        run: python tests/test_core.py

      - name: Provenance manifest
        env:
          MPLCONFIGDIR: /tmp/mpl
        run: python -m src.provenance --check
